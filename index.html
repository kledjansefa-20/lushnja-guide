<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lushnja Guide – Zbulo Lushnjën</title>
<meta name="description" content="Udhëzues dixhital i qytetit të Lushnjës: restorante, kafene, hotele, farmaci, marketet, atraksione dhe institucione.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#2f5d3a;--g2:#4a7c54;--bg:#f6f2e8;--card:#fff;--tx:#232623;--mu:#686c66;--ln:#e3dcc8;--sh:rgba(35,38,35,.1);--warn:#7a5a10;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181c18;--card:#242924;--tx:#eeeadc;--mu:#a3a899;--ln:#383f38;--g:#8fc79a;--g2:#6ea87a;--sh:rgba(0,0,0,.4);--warn:#e7c46a}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;line-height:1.15}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header{background:var(--bg);position:sticky;top:0;z-index:5;border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{display:flex;align-items:center;gap:8px;font:700 20px 'Fraunces',serif;color:var(--g);text-decoration:none}
.lang,.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:7px 13px;font:700 13px 'Nunito Sans',sans-serif;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.hero{border-radius:24px;padding:28px 20px;color:#fff;background:linear-gradient(155deg,#2f5d3a,#5b8a55 60%,#c8b27a);margin:16px 0}
.hero h1{font-size:clamp(26px,6vw,40px)}.hero p{margin-top:8px;opacity:.93;max-width:560px}
.search{position:relative;margin-top:16px}
.search input{width:100%;padding:14px 16px;border-radius:16px;border:0;font:inherit;background:#fff;color:#232623}
h2{font-size:22px;margin:28px 0 12px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cat{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px 8px;text-align:center;cursor:pointer;font:700 13px 'Nunito Sans',sans-serif;color:var(--tx)}
.cat i{display:block;font-style:normal;font-size:30px;margin-bottom:6px}
.cat.on{background:var(--g);color:#fff;border-color:var(--g)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px var(--sh);cursor:pointer;display:flex;flex-direction:column}
.cov{height:96px;display:flex;align-items:center;justify-content:center;font-size:38px;color:#fff;background-size:cover;background-position:center}
.cb{padding:12px 14px 14px}.cb h3{font-size:17px}.cb p{font-size:13.5px;color:var(--mu);margin-top:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:var(--g);margin-bottom:4px}
.chk{display:inline-block;font-size:10.5px;font-weight:700;background:#faeccc;color:#7a5a10;border-radius:8px;padding:1px 6px;margin-left:4px}
.mapwrap{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 2px 10px var(--sh)}
.mapwrap iframe{display:block;width:100%;height:340px;border:0}
.mapfb{padding:22px;text-align:center}
.btn{display:inline-block;border:0;background:var(--g);color:#fff;border-radius:14px;padding:12px 18px;font:700 15px 'Nunito Sans',sans-serif;cursor:pointer;text-decoration:none;margin:6px 6px 0 0}
.btn.alt{background:var(--card);color:var(--g);border:1px solid var(--g)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--ln)}
.empty{text-align:center;color:var(--mu);padding:28px}
.note{font-size:12.5px;color:var(--mu);margin:14px 0}
footer{border-top:1px solid var(--ln);margin-top:36px;padding:18px 0 28px;font-size:13px;color:var(--mu)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.sheet{align-items:center}.sheet>div{border-radius:24px}}
.sheet .cov{height:150px;font-size:56px}.in{padding:16px}
.kv{font-size:14.5px;margin:7px 0}.kv span{color:var(--mu)}
</style>
</head>

function item(id){return P.filter(function(x){return x.id==id})[0]}
function mapUrl(q){return 'https://www.google.com/maps?q='+encodeURIComponent(q)+'&output=embed&hl='+lang}
function gmaps(p){return 'https://www.google.com/maps/search/?api=1&query='+(p.lat?p.lat+','+p.lng:encodeURIComponent(p.n+' '+p.a.replace(/\(.*\)/,'')+' Lushnjë Albania'))}

function setLang(){lang=lang=='sq'?'en':'sq';try{localStorage.setItem('lg',lang)}catch(e){}document.documentElement.lang=lang;render()}
function setQ(v){S.q=v;var r=$('#res');if(r){var l=filt();r.innerHTML=l.length?l.map(card).join(''):emptyMsg()}}
function mapBlock(){return '<div class="mapwrap" id="map"><div class="chips">'+CATS.map(function(c){return '<button class="chip" onclick="S.mapq=\''+c[4]+'\';render()">'+c[1]+' '+T(c[2],c[3])+'</button>'}).join('')+'</div>'+(EMBED?'<iframe title="'+T('Harta e Lushnjës','Map of Lushnjë')+'" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="'+mapUrl(S.mapq)+'"></iframe>':'<div class="mapfb"><p>'+T('Harta interaktive e Google shfaqet kur faqja hostohet në link-un tënd publik. Këtu mund ta hapësh direkt:','The interactive Google map appears once the site is hosted at your public link. Here you can open it directly:')+'</p><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(S.mapq)+'">'+T('Hap hartën','Open the map')+'</a></div>')+'</div>'}
function render(){var l=filt();
$('#lg').textContent=lang=='sq'?'SQ · EN':'EN · SQ';
$('#main').innerHTML='<section class="hero"><h1>'+T('Zbulo Lushnjën','Discover Lushnja')+'</h1><p>'+T('Biznese, shërbime, institucione dhe atraksione turistike të qytetit, në një vend.','Businesses, services, institutions and tourist attractions of the city, in one place.')+'</p><div class="search"><input type="search" aria-label="'+T('Kërko','Search')+'" placeholder="'+T('Kërko restorante, farmaci, vende…','Search restaurants, pharmacies, places…')+'" value="'+esc(S.q)+'" oninput="if(S.cat!=\'all\'&&this.value){S.cat=\'all\'}setQ(this.value)"></div></section>'+
'<h2>'+T('Kategoritë','Categories')+'</h2><div class="cats">'+CATS.map(function(c){return '<button class="cat '+(S.cat==c[0]?'on':'')+'" onclick="setCat(\''+c[0]+'\')"><i aria-hidden="true">'+c[1]+'</i>'+T(c[2],c[3])+'</button>'}).join('')+'</div>'+
(S.cat=='all'&&!S.q?'<h2>'+T('Vende të veçanta','Featured Places')+'</h2><div class="grid">'+P.filter(function(p){return p.f}).map(card).join('')+'</div>':'')+
'<h2 id="list">'+(S.cat=='all'?T('Të gjitha vendet','All Places'):cn(S.cat))+' <button class="chip" '+(S.cat=='all'?'style="display:none"':'')+' onclick="setCat(\'all\')">'+T('Hiq filtrin','Clear')+'</button></h2><div class="grid" id="res">'+(l.length?l.map(card).join(''):emptyMsg())+'</div>'+
'<h2>'+T('Harta e Lushnjës','Map of Lushnja')+'</h2>'+mapBlock()+'<p class="note">'+T('Informacioni vjen nga burimet e shënuara në çdo kartë. “Për verifikim” do të thotë burim më pak i sigurt. Orari dhe çmimet shfaqen vetëm kur verifikohen.','Information comes from the sources noted on each card. “To verify” means a less reliable source. Hours and prices show only once verified.')+'</p>';
$('#foot').innerHTML='Lushnja Guide · '+T('Udhëzues i pavarur i qytetit. Nëse shihni një gabim ose dëshironi të shtoni biznesin tuaj, kontaktoni redaktorin e faqes.','An independent city guide. If you see a mistake or want to add your business, contact the site editor.')}
document.documentElement.lang=lang;render();
</script>
</body>
</html>
